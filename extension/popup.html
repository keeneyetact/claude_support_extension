<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claude Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title">
      <span id="dot" class="dot"></span>
      <h1>Claude Browser Bridge</h1>
    </div>
    <div class="header-actions">
      <button id="openPanel" class="icon-btn" title="Open in side panel (stays open while you browse)">⇥</button>
      <label class="switch" title="Allow Claude sessions to control this profile">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <div id="summary" class="summary">Loading…</div>

  <section id="handoff" class="handoff">
    <div class="handoff-head">
      <strong>Give this tab to a Claude session</strong>
      <span id="handoffOwner" class="muted small"></span>
    </div>
    <div id="handoffTab" class="tab static"></div>
    <textarea id="task" rows="2" placeholder="What should Claude do here? (optional: you can also tell it later)"></textarea>
    <div class="row">
      <button id="copyPrompt" class="primary" title="Copy a prompt to paste into any Claude Code session">Copy prompt for Claude</button>
      <span id="copied" class="muted small"></span>
    </div>
    <details class="preview">
      <summary class="muted small">Preview prompt</summary>
      <pre id="promptPreview"></pre>
    </details>
  </section>

  <main id="sessions" class="sessions"></main>

  <section class="row actions">
    <button id="detach" title="Detach the debugger from every tab (removes Chrome's 'started debugging' bar)">Release all tabs</button>
    <button id="reconnect" title="Drop and re-establish all session connections">Reconnect</button>
  </section>

  <details id="allActivity">
    <summary>All activity</summary>
    <ol id="activity" class="activity"></ol>
  </details>

  <details>
    <summary>Settings</summary>
    <form id="settings">
      <label>Profile name shown to Claude
        <input id="profileLabel" type="text" placeholder="e.g. Work, Personal">
      </label>
      <label class="check"><input id="groupTabs" type="checkbox"> Put tabs Claude opens into a coloured tab group per session</label>
      <label>Shared token (optional; must match CHROME_BRIDGE_TOKEN on the server)
        <input id="token" type="password" autocomplete="off" placeholder="leave empty to disable">
      </label>
      <div class="row">
        <label>First port <input id="portStart" type="number" min="1024" max="65000"></label>
        <label>Port count <input id="portCount" type="number" min="1" max="50"></label>
      </div>
      <div class="row">
        <button type="submit">Save</button>
        <span id="saved" class="muted small"></span>
      </div>
    </form>
    <div class="muted small" id="profileInfo"></div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
